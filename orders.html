        </div>

        <nav class="sidebar-nav flex-column">
            <a class="nav-link" href="dashboard.html">
                <i class="bi bi-house-door me-2"></i> Dashboard
            </a>
            <a class="nav-link active" href="orders.html">

            </a>
            <a class="nav-link" href="payment.html">
                <i class="bi bi-cash me-2"></i> Payments

            <a class="nav-link" href="reports.html">
                <i class="bi bi-file-earmark-bar-graph me-2"></i> Reports

            <a class="nav-link" href="setting.html">

    <div class="main-content">

        <div class="main-card p-4">

            <!-- HEADER -->
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <h5 class="fw-semibold mb-0">Order List</h5>

                <div class="d-flex gap-2 align-items-center flex-wrap">

                    <!-- CREATE ORDER -->
                    <a href="order.html" class="btn btn-primary btn-sm px-4 d-flex align-items-center gap-2">
                        <i class="bi bi-plus-lg"></i>
                        <span>Create Order</span>
                    </a>

                    <!-- FILTER STATUS -->
                    <select id="statusFilter" class="form-select form-select-sm">
                        <option value="">All Status</option>
                        <option value="pending">Pending</option>
                        <option value="progress">Progress</option>
                        <option value="complete">Completed</option>
                    </select>

                    <!-- SEARCH TYPE -->
                    <select id="searchType" class="form-select form-select-sm">
                        <option value="customer">Customer</option>
                        <option value="phone">Phone</option>
                        <option value="date">Date</option>
                    </select>

                    <!-- SEARCH INPUT -->
                    <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Search..."

                    <!-- REFRESH -->
                    <button id="refreshOrdersBtn" class="btn btn-outline-primary btn-sm" title="Refresh">
                        <i class="bi bi-arrow-clockwise"></i>
                    </button>

                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>

                            <th>Customer</th>
                            <th>No. Telepon</th>
                            <th>Service</th>
                            <th>Berat (kg)</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Amount</th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <tr>

                        </tr>
                    </tbody>
