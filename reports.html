<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry POS - Reports Penjualan</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="reports.css">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar d-flex flex-column">
        <div class="d-flex align-items-center justify-content-center mb-4 pb-3 border-bottom">
            <i class="bi bi-basket fs-3 text-primary me-2"></i>
            <h5 class="mb-0 fw-bold text-primary">Laundry POS</h5>
        </div>
        <nav class="nav flex-column">
            <a class="nav-link" href="index.html">
                <i class="bi bi-house-door me-2"></i> Dashboard
            </a>
            <a class="nav-link" href="Orders.html">
                <i class="bi bi-cart me-2"></i> Orders
            </a>
            <a class="nav-link" href="Payment.html">
                <i class="bi bi-cash me-2"></i> Payments
            </a>
            <a class="nav-link active" href="reports.html">
                <i class="bi bi-file-earmark-bar-graph me-2"></i> Reports
            </a>
            <a class="nav-link" href="Setting.html">
                <i class="bi bi-gear me-2"></i> Settings
            </a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="report-card">
            <h2>Reports Penjualan</h2>

            <!-- Filter Section -->
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label for="startDate" class="form-label">Start Date</label>
                    <input type="date" class="form-control" id="startDate" value="2025-10-01">
                </div>
                <div class="col-md-6">
                    <label for="endDate" class="form-label">End Date</label>
                    <input type="date" class="form-control" id="endDate" value="2025-10-27">
                </div>
            </div>
            <div class="d-flex justify-content-end">
                <button type="button" class="btn btn-primary me-2">Filter</button>
                <button type="button" class="btn btn-outline-secondary">Export</button>
            </div>
        </div>

        <!-- Sales Summary Table -->
        <div class="report-table">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Order ID</th>
                        <th>Customer</th>
                        <th>Amount</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>2025-10-25</td>
                        <td>#ORD1234</td>
                        <td>John Doe</td>
                        <td>$45.00</td>
                        <td>Completed</td>
                    </tr>
                    <tr>
                        <td>2025-10-26</td>
                        <td>#ORD1235</td>
                        <td>Jane Smith</td>
                        <td>$32.50</td>
                        <td>Completed</td>
                    </tr>
                    <tr>
                        <td>2025-10-27</td>
                        <td>#ORD1236</td>
                        <td>Mike Johnson</td>
                        <td>$28.00</td>
                        <td>In Progress</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Transaction Time -->
        <div class="transaction-time" id="transactionTime">
            Report Generated: Loading...
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // JavaScript for Time and Interactivity
        document.addEventListener('DOMContentLoaded', function () {
            const sidebar = document.querySelector('.sidebar');
            const toggleBtn = document.createElement('button');
            toggleBtn.className = 'btn btn-primary d-lg-none position-absolute top-0 end-0 m-2';
            toggleBtn.innerHTML = '<i class="bi bi-list"></i>';
            toggleBtn.addEventListener('click', () => {
                sidebar.classList.toggle('show');
            });
            document.body.appendChild(toggleBtn);

            // Mobile sidebar close on click outside
            document.addEventListener('click', (e) => {
                if (!sidebar.contains(e.target) && !toggleBtn.contains(e.target) && window.innerWidth < 992) {
                    sidebar.classList.remove('show');
                }
            });

            // Transaction Time
            const transactionTime = document.getElementById('transactionTime');
            function updateTransactionTime() {
                const now = new Date();
                const options = {
                    weekday: 'long',
                    day: 'numeric',
                    month: 'long',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    timeZone: 'Asia/Jakarta',
                    hour12: false
                };
                transactionTime.textContent = `Report Generated: ${now.toLocaleString('id-ID', options).replace('WIB', '')} WIB`;
            }
            updateTransactionTime(); // Set initial time
            setInterval(updateTransactionTime, 60000); // Update every minute

            // Filter and Export Buttons (Placeholder Logic)
            const filterBtn = document.querySelector('.btn-primary');
            const exportBtn = document.querySelector('.btn-outline-secondary');
            filterBtn.addEventListener('click', () => {
                alert('Filtering data based on selected dates...'); // Replace with actual filter logic
            });
            exportBtn.addEventListener('click', () => {
                alert('Exporting report...'); // Replace with export logic (e.g., CSV/PDF)
            });
        });
    </script>
</body>
</html>
