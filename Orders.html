<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry POS - New Order</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="Orders.css">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar d-flex flex-column">
        <div class="d-flex align-items-center justify-content-center mb-4 pb-3 border-bottom">
            <i class="bi bi-basket fs-3 text-primary me-2"></i>
            <h5 class="mb-0 fw-bold text-primary">Laundry POS</h5>
        </div>
        <nav class="nav flex-column">
            <a class="nav-link" href="index.html">
                <i class="bi bi-house-door me-2"></i> Dashboard
            </a>
            <a class="nav-link active" href="Orders.html">
                <i class="bi bi-cart me-2"></i> Orders
            </a>
            <a class="nav-link" href="Payment.html">
                <i class="bi bi-cash me-2"></i> Payments
            </a>
            <a class="nav-link" href="reports.html">
                <i class="bi bi-file-earmark-bar-graph me-2"></i> Reports
            </a>
            <a class="nav-link" href="Setting.html">
                <i class="bi bi-gear me-2"></i> Settings
            </a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="order-card">
            <h2>New Order</h2>

            <!-- Customer Details -->
            <div class="mb-4">
                <h3 class="section-title">Customer Details</h3>
                <div class="mb-3">
                    <label for="customerSelect" class="form-label">Select Customer</label>
                    <select class="form-control" id="customerSelect">
                        <option value="">Select a customer</option>
                        <option value="1">John Doe</option>
                        <option value="2">Jane Smith</option>
                        <option value="3">Mike Johnson</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="customerName" class="form-label">Customer Name</label>
                    <input type="text" class="form-control" id="customerName" placeholder="Enter customer name">
                </div>
                <div class="mb-3">
                    <label for="phoneNumber" class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" id="phoneNumber" placeholder="Enter phone number">
                </div>
            </div>

            <!-- Order Details -->
            <div>
                <h3 class="section-title">Order Details</h3>
                <div class="mb-3">
                    <label for="serviceSelect" class="form-label">Select Service</label>
                    <select class="form-control" id="serviceSelect">
                        <option value="">Select a service</option>
                        <option value="1">Wash & Fold</option>
                        <option value="2">Dry Cleaning</option>
                        <option value="3">Ironing</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="weightQuantity" class="form-label">Weight/Quantity</label>
                    <input type="number" class="form-control" id="weightQuantity" placeholder="Enter weight or quantity" step="0.1">
                </div>
                <div class="mb-3">
                    <label for="price" class="form-label">Price</label>
                    <input type="number" class="form-control" id="price" placeholder="Enter price" step="0.01">
                </div>
                <div class="mb-3">
                    <label for="estimatedCompletion" class="form-label">Estimated Completion</label>
                    <input type="datetime-local" class="form-control" id="estimatedCompletion">
                </div>
                <div class="btn-group mb-3" role="group">
                    <button type="button" class="btn btn-outline-secondary">Add Item</button>
                    <button type="button" class="btn btn-outline-secondary">Remove Item</button>
                </div>
                <button type="submit" class="btn btn-primary">Create Order</button>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Optional: Add JavaScript for interactivity (e.g., form validation or dynamic updates)
        document.addEventListener('DOMContentLoaded', function () {
            const sidebar = document.querySelector('.sidebar');
            const toggleBtn = document.createElement('button');
            toggleBtn.className = 'btn btn-primary d-lg-none position-absolute top-0 end-0 m-2';
            toggleBtn.innerHTML = '<i class="bi bi-list"></i>';
            toggleBtn.addEventListener('click', () => {
                sidebar.classList.toggle('show');
            });
            document.body.appendChild(toggleBtn);

            // Mobile sidebar close on click outside
            document.addEventListener('click', (e) => {
                if (!sidebar.contains(e.target) && !toggleBtn.contains(e.target) && window.innerWidth < 992) {
                    sidebar.classList.remove('show');
                }
            });
        });
    </script>
</body>
</html>
